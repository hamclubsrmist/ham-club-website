<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>HAM Club | Member Profile</title>
  <style>
    :root { color-scheme: dark; --bg:#050505; --text:#f7f7f7; --muted:#b8b8be; --line:#777; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      margin:0; background:radial-gradient(ellipse at 50% 20%, #202020 0, #090909 34%, #030303 75%);
      color:var(--text); font-family:Arial,Helvetica,sans-serif;
    }
    a { color:inherit; }
    .page { width:min(100%,1000px); margin:0 auto; padding:34px 28px 24px; }
    .hero { text-align:center; }
    .eyebrow { margin:0 0 20px; font-size:clamp(11px,2vw,17px); letter-spacing:.58em; text-transform:uppercase; color:#e3e3e3; }
    h1 { margin:0; font-size:clamp(35px,7.4vw,88px); line-height:1.05; font-weight:900; letter-spacing:.015em; overflow-wrap:anywhere; }
    .portrait-wrap { position:relative; width:min(100%,470px); height:clamp(300px,49vw,480px); margin:16px auto 0; display:flex; align-items:flex-end; justify-content:center; }
    .portrait-wrap::before { content:""; position:absolute; width:78%; height:74%; bottom:7%; border-radius:50%; background:#777; filter:blur(65px); opacity:.28; }
    .portrait { position:relative; z-index:1; width:100%; height:100%; object-fit:contain; object-position:center bottom; }
    .role { margin:16px 0 7px; font-size:clamp(20px,3.5vw,38px); font-weight:800; letter-spacing:.035em; text-transform:uppercase; }
    .department { margin:0 0 8px; font-size:clamp(14px,2vw,22px); letter-spacing:.18em; }
    .years { margin:0; font-size:clamp(14px,2vw,20px); letter-spacing:.38em; color:#dedee2; }
    .rule { border:0; border-top:1px solid #ddd; margin:18px 0 23px; }
    .section-label { margin:0 0 12px; font-size:clamp(12px,1.7vw,16px); font-weight:500; letter-spacing:.55em; text-transform:uppercase; }
    .social-list { display:flex; flex-direction:column; }
    .social-row { display:grid; grid-template-columns:82px 1fr 34px; align-items:center; gap:20px; min-height:89px; padding:11px 2px; text-decoration:none; border-bottom:1px solid #595959; }
    .social-row:last-child { border-bottom:0; }
    .social-icon { width:64px; height:64px; border-radius:15px; display:grid; place-items:center; color:#fff; font-size:35px; font-weight:800; overflow:hidden; }
    .linkedin { background:#087bb8; font-family:Arial,sans-serif; }
    .instagram { background:linear-gradient(45deg,#ffd45a,#ff6b35,#d62976,#8134af); }
    .email { background:#f5f5f5; color:#db4437; }
    .phone { background:#16c653; }
    .social-icon svg { width:37px; height:37px; }
    .social-name { display:block; margin-bottom:6px; font-size:clamp(13px,1.8vw,19px); font-weight:700; letter-spacing:.11em; }
    .social-value { display:block; color:var(--muted); font-size:clamp(12px,1.7vw,17px); line-height:1.45; overflow-wrap:anywhere; }
    .arrow { justify-self:end; font-size:38px; font-weight:200; line-height:1; }
    .about { color:#dedee4; font-size:clamp(15px,2.1vw,21px); line-height:1.65; margin:0; }
    .footer { display:flex; justify-content:space-between; align-items:center; gap:16px; padding-top:25px; margin-top:35px; border-top:1px solid #ddd; color:#d2d2d2; font-size:clamp(10px,1.5vw,15px); letter-spacing:.3em; }
    .status { padding:70px 10px; text-align:center; color:#ddd; }
    .status p { color:#b8b8be; line-height:1.6; }
    .retry { background:#f5f5f5; color:#111; border:0; padding:11px 18px; border-radius:6px; cursor:pointer; font-weight:700; }
    .hidden { display:none !important; }
    @media(max-width:600px) {
      .page { padding:25px 18px 20px; }
      .eyebrow { letter-spacing:.35em; }
      .portrait-wrap { height:320px; }
      .social-row { grid-template-columns:58px minmax(0,1fr) 24px; gap:12px; min-height:76px; }
      .social-icon { width:52px; height:52px; border-radius:12px; font-size:29px; }
      .social-icon svg { width:30px; height:30px; }
      .arrow { font-size:29px; }
      .footer { letter-spacing:.16em; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div id="loading" class="status">Loading member profile…</div>
    <div id="error" class="status hidden">
      <h2>Member profile unavailable</h2>
      <p id="errorText">We could not find this member. Please check the QR link or try again later.</p>
      <button class="retry" id="retryButton" type="button">Try again</button>
    </div>

    <article id="profile" class="hidden">
      <header class="hero">
        <p class="eyebrow" id="topRole">HAM CLUB MEMBER</p>
        <h1 id="memberName">MEMBER NAME</h1>
        <div class="portrait-wrap">
          <img class="portrait" id="memberPhoto" alt="Member portrait">
        </div>
        <p class="role" id="memberRole">MEMBER ROLE</p>
        <p class="department" id="memberDepartment">ECE</p>
        <p class="years" id="memberYears">2024 - 2028</p>
      </header>

      <hr class="rule">
      <section aria-labelledby="socialHeading">
        <h2 class="section-label" id="socialHeading">Contact &amp; Social</h2>
        <div class="social-list" id="socialList"></div>
      </section>

      <hr class="rule">
      <section aria-labelledby="aboutHeading">
        <h2 class="section-label" id="aboutHeading">About</h2>
        <p class="about" id="memberAbout">HAM Club member.</p>
      </section>
      <footer class="footer"><span>HAM CLUB</span><span>SRMIST RAMAPURAM</span></footer>
    </article>
  </main>

  <script>
    // Keep this URL pointed to the existing Render backend.
    const API_URL = "https://ham-club-backend.onrender.com/api/team";
    const FALLBACK_PHOTO = "images/default-member.png";

    const $ = (id) => document.getElementById(id);
    const escapeText = (value) => String(value ?? "").trim();
    const normaliseId = (value) => escapeText(value).toUpperCase();

    function getMemberId(member) {
      return escapeText(member.memberId || member.memberID || member.member_id || member.qrId || member.qrID);
    }
    function getName(member) {
      return escapeText(member.name || member.fullName || member.fullname || member.studentName || member.memberName || member.username);
    }
    function getRole(member) {
      return escapeText(member.designation || member.role || member.position || member.domain || member.title || "HAM Club Member");
    }
    function getDepartment(member) {
      return escapeText(member.department || member.dept || member.branch || "ECE");
    }
    function getYears(member) {
      const direct = member.academicYear || member.yearRange || member.batch || member.studyPeriod;
      if (direct) return escapeText(direct);
      const start = member.startYear || member.admissionYear;
      const end = member.endYear || member.graduationYear || member.passoutYear;
      return start && end ? `${start} - ${end}` : escapeText(member.year || "");
    }
    function getPhoto(member) {
      return escapeText(member.photo || member.image || member.profileImage || member.profilePic || member.photoUrl || "");
    }
    function absoluteImageUrl(value) {
      if (!value) return FALLBACK_PHOTO;
      if (/^https?:\/\//i.test(value)) return value;
      return "https://ham-club-backend.onrender.com/" + value.replace(/^\/+/, "");
    }
    function addSocialRow(label, value, href, kind) {
      if (!value) return;
      const row = document.createElement("a");
      row.className = "social-row";
      row.href = href || "#";
      row.target = "_blank";
      row.rel = "noopener noreferrer";
      const icon = document.createElement("span");
      icon.className = "social-icon " + kind;
      icon.setAttribute("aria-hidden", "true");
      if (kind === "linkedin") icon.textContent = "in";
      else if (kind === "instagram") {
        icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="18" cy="6" r="1" fill="white" stroke="none"/></svg>';
      } else if (kind === "email") {
        icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#db4437" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>';
      } else {
        icon.innerHTML = '<svg viewBox="0 0 24 24" fill="white"><path d="M6.6 10.8a15.5 15.5 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.24 11 11 0 0 0 3.45.55 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17.85 17.85 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11 11 0 0 0 .55 3.45 1 1 0 0 1-.25 1z"/></svg>';
      }
      const content = document.createElement("span");
      const name = document.createElement("span");
      name.className = "social-name";
      name.textContent = label.toUpperCase();
      const val = document.createElement("span");
      val.className = "social-value";
      val.textContent = value;
      content.append(name, val);
      const arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.textContent = "↗";
      row.append(icon, content, arrow);
      $("socialList").appendChild(row);
    }
    function showError(message) {
      $("loading").classList.add("hidden");
      $("profile").classList.add("hidden");
      $("error").classList.remove("hidden");
      $("errorText").textContent = message;
    }
    async function loadProfile() {
      $("error").classList.add("hidden");
      $("profile").classList.add("hidden");
      $("loading").classList.remove("hidden");
      const params = new URLSearchParams(window.location.search);
      const requestedId = params.get("id");
      if (!requestedId) {
        showError("The QR link does not contain a member ID.");
        return;
      }
      try {
        const response = await fetch(API_URL, { headers: { "Accept": "application/json" } });
        if (!response.ok) throw new Error("The member service returned HTTP " + response.status + ".");
        const result = await response.json();
        const members = Array.isArray(result) ? result : (result.team || result.data || result.members || []);
        if (!Array.isArray(members)) throw new Error("The member list response had an unexpected format.");
        // Match only the existing public member/QR ID; never generate a new ID.
        let member = members.find(item => normaliseId(getMemberId(item)) === normaliseId(requestedId));
        // Backward compatibility: older QR URLs may contain a Mongo ObjectId.
        if (!member && /^[a-f0-9]{24}$/i.test(requestedId)) {
          member = members.find(item => escapeText(item._id || item.id) === requestedId);
        }
        if (!member) throw new Error("No member was found for ID " + requestedId + ". The saved member ID field may need to be checked in the backend.");
        $("memberName").textContent = getName(member) || "HAM CLUB MEMBER";
        $("topRole").textContent = getRole(member).toUpperCase();
        $("memberRole").textContent = getRole(member);
        $("memberDepartment").textContent = getDepartment(member);
        $("memberYears").textContent = getYears(member);
        $("memberPhoto").src = absoluteImageUrl(getPhoto(member));
        $("memberPhoto").alt = (getName(member) || "Member") + " profile photo";
        $("memberPhoto").onerror = () => { $("memberPhoto").style.visibility = "hidden"; };
        $("memberAbout").textContent = escapeText(member.about || member.bio || member.description || "HAM Club member at SRMIST Ramapuram.");
        $("socialList").replaceChildren();
        const linkedin = escapeText(member.linkedin || member.linkedIn || member.linkedinUrl || "");
        const instagram = escapeText(member.instagram || member.instagramUrl || member.insta || "");
        const email = escapeText(member.email || member.emailAddress || "");
        const phone = escapeText(member.phone || member.mobile || member.mobileNumber || member.phoneNumber || "");
        addSocialRow("LinkedIn", linkedin, linkedin ? (linkedin.startsWith("http") ? linkedin : "https://" + linkedin) : "", "linkedin");
        addSocialRow("Instagram", instagram, instagram ? (instagram.startsWith("http") ? instagram : "https://www.instagram.com/" + instagram.replace(/^@/, "")) : "", "instagram");
        addSocialRow("Email", email, email ? "mailto:" + email : "", "email");
        addSocialRow("Phone", phone, phone ? "tel:" + phone.replace(/[^\d+]/g, "") : "", "phone");
        $("loading").classList.add("hidden");
        $("profile").classList.remove("hidden");
      } catch (error) {
        showError(error.message || "Could not load this member profile. Please try again.");
      }
    }
    $("retryButton").addEventListener("click", loadProfile);
    loadProfile();
  </script>
</body>
</html>
