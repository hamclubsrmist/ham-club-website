<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Events | HAM Club</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #123;
        }

        /* ================================
           HEADER
        ================================= */

        header {
            background: #0f4f83;
            color: white;
            padding: 20px 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .logo {
            width: 75px;
            height: 75px;
            object-fit: contain;
        }

        .header-title h1 {
            font-size: 36px;
            margin-bottom: 5px;
        }

        .header-title p {
            font-size: 18px;
        }

        .dashboard-btn {
            background: white;
            color: #0f4f83;
            text-decoration: none;
            padding: 16px 25px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .dashboard-btn:hover {
            background: #e8f1fa;
        }

        /* ================================
           MAIN
        ================================= */

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 50px auto;
        }

        .page-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .page-heading h2 {
            color: #0f4f83;
            font-size: 38px;
        }

        .add-btn {
            background: #0f4f83;
            color: white;
            border: none;
            padding: 17px 28px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .add-btn:hover {
            background: #0b3e68;
        }

        /* ================================
           FORM
        ================================= */

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            margin-bottom: 45px;
            display: none;
        }

        .form-card.show {
            display: block;
        }

        .form-card h3 {
            color: #0f4f83;
            font-size: 30px;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        input,
        select,
        textarea {
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 15px;
            font-size: 17px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #0f4f83;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        .form-buttons {
            margin-top: 25px;
            display: flex;
            gap: 15px;
        }

        .save-btn {
            background: #0f4f83;
            color: white;
            border: none;
            padding: 16px 30px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .cancel-btn {
            background: #ddd;
            color: #222;
            border: none;
            padding: 16px 30px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        /* ================================
           EVENTS
        ================================= */

        .events-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
        }

        .event-card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .event-card h3 {
            color: #0f4f83;
            font-size: 27px;
            margin-bottom: 20px;
        }

        .event-info {
            font-size: 17px;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .event-description {
            font-size: 17px;
            line-height: 1.6;
            margin: 18px 0;
        }

        .category {
            display: inline-block;
            background: #e7f1fb;
            color: #0f4f83;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .event-image {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .event-buttons {
            display: flex;
            gap: 12px;
        }

        .edit-btn {
            background: #0f4f83;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .delete-btn {
            background: #f44343;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .edit-btn:hover {
            background: #0b3e68;
        }

        .delete-btn:hover {
            background: #d93636;
        }

        .empty-message {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            color: #666;
            font-size: 20px;
        }

        .loading {
            text-align: center;
            font-size: 20px;
            padding: 30px;
        }

        /* ================================
           RESPONSIVE
        ================================= */

        @media (max-width: 768px) {

            header {
                padding: 20px;
            }

            .header-title h1 {
                font-size: 27px;
            }

            .header-title p {
                font-size: 15px;
            }

            .logo {
                width: 55px;
                height: 55px;
            }

            .dashboard-btn {
                padding: 12px;
                font-size: 14px;
            }

            .container {
                width: 94%;
                margin: 30px auto;
            }

            .page-heading {
                align-items: flex-start;
                gap: 20px;
            }

            .page-heading h2 {
                font-size: 30px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .events-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- =================================
         HEADER
    ================================== -->

    <header>

        <div class="header-left">

            <img
                src="../images/ham-logo.png"
                alt="HAM Club Logo"
                class="logo"
                onerror="this.style.display='none'"
            >

            <div class="header-title">
                <h1>HAM CLUB</h1>
                <p>Administrator Dashboard</p>
            </div>

        </div>

        <a href="dashboard.html" class="dashboard-btn">
            ← Dashboard
        </a>

    </header>


    <!-- =================================
         MAIN
    ================================== -->

    <main class="container">

        <div class="page-heading">

            <h2>📅 Manage Events</h2>

            <button class="add-btn" onclick="showAddForm()">
                + Add Event
            </button>

        </div>


        <!-- =================================
             ADD / EDIT FORM
        ================================== -->

        <section class="form-card" id="formCard">

            <h3 id="formTitle">Add New Event</h3>

            <form id="eventForm">

                <div class="form-grid">

                    <!-- TITLE -->

                    <div class="form-group">

                        <label for="title">
                            Event Title
                        </label>

                        <input
                            type="text"
                            id="title"
                            placeholder="Enter event title"
                            required
                        >

                    </div>


                    <!-- DATE -->

                    <div class="form-group">

                        <label for="date">
                            Event Date
                        </label>

                        <input
                            type="date"
                            id="date"
                            required
                        >

                    </div>


                    <!-- LOCATION -->

                    <div class="form-group">

                        <label for="location">
                            Location
                        </label>

                        <input
                            type="text"
                            id="location"
                            placeholder="Example: SRMIST Ramapuram"
                        >

                    </div>


                    <!-- CATEGORY -->

                    <div class="form-group">

                        <label for="category">
                            Category
                        </label>

                        <select id="category">

                            <option value="upcoming">
                                Upcoming
                            </option>

                            <option value="past">
                                Past
                            </option>

                        </select>

                    </div>


                    <!-- DESCRIPTION -->

                    <div class="form-group full">

                        <label for="description">
                            Description
                        </label>

                        <textarea
                            id="description"
                            placeholder="Enter event description"
                            required
                        ></textarea>

                    </div>


                    <!-- IMAGE -->

                    <div class="form-group full">

                        <label for="image">
                            Image URL
                        </label>

                        <input
                            type="text"
                            id="image"
                            placeholder="Optional image URL"
                        >

                    </div>

                </div>


                <div class="form-buttons">

                    <button
                        type="submit"
                        class="save-btn"
                    >
                        Save Event
                    </button>

                    <button
                        type="button"
                        class="cancel-btn"
                        onclick="cancelForm()"
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </section>


        <!-- =================================
             EVENTS LIST
        ================================== -->

        <section>

            <div id="eventsList">
                <div class="loading">
                    Loading events...
                </div>
            </div>

        </section>

    </main>


    <!-- =================================
         JAVASCRIPT
    ================================== -->

    <script>

        // =================================
        // API
        // =================================

        const API_URL = "https://ham-club-backend.onrender.com/api/events";


        // =================================
        // EDITING EVENT ID
        // =================================

        let editingEventId = null;


        // =================================
        // AUTHORIZATION
        // =================================

        function getToken() {

            return localStorage.getItem("hamClubToken");

        }


        function getAuthHeaders() {

            const token = getToken();

            return {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            };

        }


        // =================================
        // CHECK LOGIN
        // =================================

        function checkLogin() {

            const token = getToken();

            if (!token) {

                alert("Please login as admin first.");

                window.location.href = "login.html";

                return false;
            }

            return true;

        }


        // =================================
        // LOAD EVENTS
        // =================================

        async function loadEvents() {

    try {

        const response = await fetch(
            "https://ham-club-backend.onrender.com/api/events"
        );

        if (!response.ok) {
            throw new Error("Failed to fetch events");
        }

        const result = await response.json();

        console.log("Events API response:", result);

        // Handle different API response formats
        let events = [];

        if (Array.isArray(result)) {

            events = result;

        } else if (Array.isArray(result.events)) {

            events = result.events;

        } else if (Array.isArray(result.data)) {

            events = result.data;

        } else {

            console.error(
                "Unexpected events response:",
                result
            );

            throw new Error(
                "Invalid events data received from server"
            );
        }

        displayEvents(events);

    } catch (error) {

        console.error(
            "Load events error:",
            error
        );

        document.getElementById("eventsList").innerHTML = `
            <div class="error-box">
                ❌ Failed to load events.
                <br><br>
                Please make sure the backend server is running.
            </div>
        `;
    }
}


        // =================================
        // DISPLAY EVENTS
        // =================================

        function displayEvents(events) {

            const container =
                document.getElementById("eventsList");


            if (!events || events.length === 0) {

                container.innerHTML = `
                    <div class="empty-message">
                        No events found.
                        <br><br>
                        Click "+ Add Event" to create your first event.
                    </div>
                `;

                return;
            }


            container.innerHTML = `

                <div class="events-container">

                    ${events.map(event => `

                        <div class="event-card">

                            ${
                                event.image
                                ?
                                `<img
                                    src="${event.image}"
                                    alt="${escapeHtml(event.title)}"
                                    class="event-image"
                                    onerror="this.style.display='none'"
                                >`
                                :
                                ""
                            }

                            <h3>
                                ${escapeHtml(event.title)}
                            </h3>


                            <div class="event-info">
                                📅 <strong>Date:</strong>
                                ${formatDate(event.date)}
                            </div>


                            <div class="event-info">
                                📍 <strong>Location:</strong>
                                ${escapeHtml(event.location || "Not specified")}
                            </div>


                            <div class="event-description">
                                ${escapeHtml(event.description)}
                            </div>


                            <span class="category">
                                ${escapeHtml(event.category || "upcoming")}
                            </span>


                            <div class="event-buttons">

                                <button
                                    type="button"
                                    class="edit-btn"
                                    data-event-id="${escapeHtml(event._id)}"
                                >
                                    ✏️ Edit
                                </button>


                                <button
                                    class="delete-btn"
                                    onclick="deleteEvent('${event._id}')"
                                >
                                    🗑️ Delete
                                </button>

                            </div>

                        </div>

                    `).join("")}

                </div>

            `;

            // Attach safe click handlers to the generated Edit buttons.
            container.querySelectorAll(".edit-btn").forEach(function (button) {
                button.addEventListener("click", function () {
                    const eventId = button.dataset.eventId;

                    const selectedEvent = events.find(function (event) {
                        return String(event._id) === String(eventId);
                    });

                    if (!selectedEvent) {
                        alert("Event not found. Please refresh the page.");
                        return;
                    }

                    editEvent(selectedEvent);
                });
            });

        }


        // =================================
        // SHOW ADD FORM
        // =================================

        function showAddForm() {

            editingEventId = null;

            document.getElementById("formTitle").textContent =
                "Add New Event";

            document.getElementById("eventForm").reset();

            document.getElementById("formCard")
                .classList.add("show");

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        // =================================
        // EDIT EVENT
        // =================================

        function editEvent(event) {

            editingEventId = event._id;


            document.getElementById("formTitle").textContent =
                "Edit Event";


            document.getElementById("title").value =
                event.title || "";


            document.getElementById("date").value =
                formatDateForInput(event.date);


            document.getElementById("location").value =
                event.location || "";


            document.getElementById("category").value =
                event.category || "upcoming";


            document.getElementById("description").value =
                event.description || "";


            document.getElementById("image").value =
                event.image || "";


            document.getElementById("formCard")
                .classList.add("show");


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        // =================================
        // CANCEL FORM
        // =================================

        function cancelForm() {

            editingEventId = null;

            document.getElementById("eventForm").reset();

            document.getElementById("formCard")
                .classList.remove("show");

        }


        // =================================
        // SAVE / UPDATE EVENT
        // =================================

        document
            .getElementById("eventForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();


                // Check admin login

                if (!checkLogin()) {
                    return;
                }


                const eventData = {

                    title:
                        document.getElementById("title").value.trim(),

                    date:
                        document.getElementById("date").value,

                    location:
                        document.getElementById("location").value.trim(),

                    category:
                        document.getElementById("category").value,

                    description:
                        document.getElementById("description").value.trim(),

                    image:
                        document.getElementById("image").value.trim()

                };


                try {

                    let response;


                    // =============================
                    // UPDATE
                    // =============================

                    if (editingEventId) {

                        response = await fetch(
                            `${API_URL}/${editingEventId}`,
                            {
                                method: "PUT",

                                headers: getAuthHeaders(),

                                body: JSON.stringify(eventData)
                            }
                        );

                    }


                    // =============================
                    // CREATE
                    // =============================

                    else {

                        response = await fetch(
                            API_URL,
                            {
                                method: "POST",

                                headers: getAuthHeaders(),

                                body: JSON.stringify(eventData)
                            }
                        );

                    }


                    const data = await response.json();


                    if (!response.ok) {

                        if (
                            response.status === 401 ||
                            response.status === 403
                        ) {

                            alert(
                                "Access denied. Please login again as admin."
                            );

                            localStorage.removeItem("hamClubToken");

                            window.location.href = "login.html";

                            return;
                        }


                        throw new Error(
                            data.message ||
                            "Failed to save event"
                        );

                    }


                    alert(
                        editingEventId
                        ? "✅ Event updated successfully!"
                        : "✅ Event added successfully!"
                    );


                    cancelForm();

                    await loadEvents();


                } catch (error) {

                    console.error("Save event error:", error);

                    alert(
                        "❌ " + error.message
                    );

                }

            });


        // =================================
        // DELETE EVENT
        // =================================

        async function deleteEvent(id) {

            if (!checkLogin()) {
                return;
            }


            const confirmDelete = confirm(
                "Are you sure you want to delete this event?"
            );


            if (!confirmDelete) {
                return;
            }


            try {

                const response = await fetch(
                    `${API_URL}/${id}`,
                    {
                        method: "DELETE",

                        headers: {
                            "Authorization":
                                "Bearer " + getToken()
                        }
                    }
                );


                const data = await response.json();


                if (!response.ok) {

                    if (
                        response.status === 401 ||
                        response.status === 403
                    ) {

                        alert(
                            "Access denied. Please login again as admin."
                        );

                        localStorage.removeItem("hamClubToken");

                        window.location.href = "login.html";

                        return;
                    }


                    throw new Error(
                        data.message ||
                        "Failed to delete event"
                    );

                }


                alert(
                    "✅ Event deleted successfully!"
                );


                loadEvents();


            } catch (error) {

                console.error(
                    "Delete event error:",
                    error
                );

                alert(
                    "❌ " + error.message
                );

            }

        }


        // =================================
        // FORMAT DATE
        // =================================

        function formatDate(dateString) {

            if (!dateString) {
                return "Not specified";
            }


            const date = new Date(dateString);


            if (isNaN(date.getTime())) {
                return dateString;
            }


            return date.toLocaleDateString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "short",
                    year: "numeric"
                }
            );

        }


        // =================================
        // DATE FOR INPUT
        // =================================

        function formatDateForInput(dateString) {

            if (!dateString) {
                return "";
            }


            const date = new Date(dateString);


            if (isNaN(date.getTime())) {
                return "";
            }


            const year =
                date.getFullYear();


            const month =
                String(
                    date.getMonth() + 1
                ).padStart(2, "0");


            const day =
                String(
                    date.getDate()
                ).padStart(2, "0");


            return `${year}-${month}-${day}`;

        }


        // =================================
        // ESCAPE HTML
        // =================================

        function escapeHtml(value) {

            if (value === null ||
                value === undefined) {

                return "";

            }


            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        // =================================
        // START
        // =================================

        checkLogin();

        loadEvents();

    </script>

</body>
</html>
