
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Messages | HAM Club Admin</title>

  <style>
    :root {
      --navy: #103f70;
      --gold: #ffc107;
      --bg: #f3f6fb;
      --text: #243247;
      --muted: #667085;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    header {
      background: var(--navy);
      color: white;
      padding: 20px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    header a:hover {
      color: var(--gold);
    }

    main {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .toolbar h2 {
      margin-bottom: 6px;
    }

    .toolbar p {
      color: var(--muted);
      margin-top: 0;
    }

    .toolbar-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    input,
    button {
      font: inherit;
      border-radius: 8px;
      padding: 11px 14px;
    }

    input {
      border: 1px solid var(--border);
      background: white;
      min-width: 220px;
    }

    button {
      background: var(--navy);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #175792;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .panel {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 5px 24px rgba(20, 40, 70, 0.07);
      overflow-x: auto;
    }

    #status {
      padding: 12px;
      margin-bottom: 16px;
      border-radius: 8px;
      background: #eef4ff;
      color: var(--navy);
      overflow-wrap: anywhere;
    }

    #status.error {
      background: #fff0f0;
      color: #a32020;
    }

    #status.success {
      background: #ecfdf3;
      color: #176b3a;
    }

    .summary {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .summary-card {
      background: #f7f9fc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      min-width: 150px;
    }

    .summary-card span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 5px;
    }

    .summary-card strong {
      font-size: 24px;
      color: var(--navy);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th,
    td {
      text-align: left;
      padding: 14px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    th {
      background: #f7f9fc;
      color: var(--navy);
    }

    td {
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 35px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 20px;
      }

      .toolbar,
      .toolbar-actions {
        width: 100%;
      }

      .toolbar-actions {
        flex-direction: column;
      }

      .toolbar-actions input,
      .toolbar-actions button {
        width: 100%;
      }

      main {
        margin-top: 20px;
      }

      .panel {
        padding: 12px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>HAM Club — Contact Messages</h1>
    <a href="./">← Back to Admin</a>
  </header>

  <main>
    <div class="toolbar">
      <div>
        <h2>Inbox</h2>
        <p>Messages submitted through the HAM Club website.</p>
      </div>

      <div class="toolbar-actions">
        <input
          id="search"
          type="search"
          placeholder="Search messages..."
          aria-label="Search messages"
        >

        <button id="refresh" type="button">
          Refresh
        </button>
      </div>
    </div>

    <section class="summary">
      <div class="summary-card">
        <span>Total messages loaded</span>
        <strong id="totalCount">—</strong>
      </div>
    </section>

    <section class="panel">
      <div id="status" role="status" aria-live="polite">
        Ready to load messages.
      </div>

      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Message</th>
            <th>Date</th>
          </tr>
        </thead>

        <tbody id="messages">
          <tr>
            <td colspan="4" class="empty">
              Click Refresh to load messages.
            </td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <script>
    const API_URL =
      "https://ham-club-backend.onrender.com/api/contact";

    const statusBox = document.getElementById("status");
    const tableBody = document.getElementById("messages");
    const refreshButton = document.getElementById("refresh");
    const searchInput = document.getElementById("search");
    const totalCount = document.getElementById("totalCount");

    let allMessages = [];

    function setStatus(message, type = "") {
      statusBox.textContent = message;
      statusBox.className = type;
    }

    function getAdminToken() {
      return localStorage.getItem("hamClubToken") || "";
    }

    function getField(item, keys) {
      for (const key of keys) {
        if (item && item[key] !== undefined && item[key] !== null) {
          return item[key];
        }
      }

      return "";
    }

    function normaliseMessages(data) {
      if (Array.isArray(data)) {
        return data;
      }

      if (data && Array.isArray(data.contacts)) {
        return data.contacts;
      }

      if (data && Array.isArray(data.messages)) {
        return data.messages;
      }

      if (data && Array.isArray(data.data)) {
        return data.data;
      }

      return null;
    }

    function formatDate(value) {
      if (!value) return "—";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return String(value);
      }

      return date.toLocaleString();
    }

    function renderMessages() {
      const query = searchInput.value.trim().toLowerCase();

      const filtered = allMessages.filter(item => {
        const searchable = [
          getField(item, ["name", "fullName", "senderName"]),
          getField(item, ["email", "senderEmail"]),
          getField(item, ["message", "content", "subject"])
        ].join(" ").toLowerCase();

        return searchable.includes(query);
      });

      totalCount.textContent = String(allMessages.length);
      tableBody.replaceChildren();

      if (filtered.length === 0) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");

        cell.colSpan = 4;
        cell.className = "empty";
        cell.textContent = allMessages.length
          ? "No messages match your search."
          : "No contact messages found.";

        row.appendChild(cell);
        tableBody.appendChild(row);
        return;
      }

      filtered.forEach(item => {
        const row = document.createElement("tr");

        const name = getField(item, [
          "name", "fullName", "senderName"
        ]);

        const email = getField(item, [
          "email", "senderEmail"
        ]);

        const message = getField(item, [
          "message", "content", "subject"
        ]);

        const date = getField(item, [
          "createdAt", "date", "timestamp"
        ]);

        [name || "—", email || "—", message || "—", formatDate(date)]
          .forEach(value => {
            const cell = document.createElement("td");
            cell.textContent = String(value);
            row.appendChild(cell);
          });

        tableBody.appendChild(row);
      });
    }

    async function loadMessages() {
      refreshButton.disabled = true;
      setStatus("Loading contact messages...");

      try {
        const token = getAdminToken();

        if (!token) {
          throw new Error(
            "Admin login token was not found. Please log in through " +
            "your existing admin login page first, then reopen Messages."
          );
        }

        const response = await fetch(API_URL, {
          method: "GET",
          headers: {
            "Accept": "application/json",
            "Authorization": "Bearer " + token
          },
          cache: "no-store"
        });

        if (response.status === 401 || response.status === 403) {
          throw new Error(
            "Your admin session was rejected (HTTP " +
            response.status +
            "). Please log in again through the existing admin login page."
          );
        }

        if (!response.ok) {
          throw new Error(
            "The server returned HTTP " + response.status +
            ". Please check the backend deployment."
          );
        }

        const data = await response.json();
        const messages = normaliseMessages(data);

        if (messages === null) {
          throw new Error(
            "The contact endpoint responded, but its data format " +
            "was not recognised. Check contactController.js."
          );
        }

        allMessages = messages;
        renderMessages();

        setStatus(
          "Messages loaded successfully.",
          "success"
        );
      } catch (error) {
        allMessages = [];
        renderMessages();

        setStatus(
          "Unable to load messages: " + error.message,
          "error"
        );
      } finally {
        refreshButton.disabled = false;
      }
    }

    refreshButton.addEventListener("click", loadMessages);
    searchInput.addEventListener("input", renderMessages);

    // Load messages when the page opens.
    loadMessages();
  </script>
</body>
</html>
