<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery Management | HAM Club</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f6fa;
            color: #222;
        }

        /* ================= HEADER ================= */

        .header {
            background: #0d477d;
            color: white;
            padding: 18px 35px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 3px 12px rgba(0,0,0,0.15);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-left img {
            width: 55px;
            height: 55px;
            object-fit: contain;
            background: white;
            border-radius: 10px;
            padding: 4px;
        }

        .header-left h1 {
            font-size: 24px;
        }

        .header-left p {
            font-size: 13px;
            opacity: 0.85;
            margin-top: 4px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .top-btn {
            border: none;
            padding: 11px 18px;
            border-radius: 7px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn {
            background: #1769aa;
        }

        .logout-btn {
            background: #e53935;
        }

        /* ================= MAIN ================= */

        .container {
            max-width: 1400px;
            margin: 35px auto;
            padding: 0 25px;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h2 {
            color: #0d477d;
            font-size: 30px;
            margin-bottom: 7px;
        }

        .page-title p {
            color: #666;
        }

        /* ================= FORM ================= */

        .form-card {
            background: white;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            margin-bottom: 35px;
        }

        .form-card h3 {
            color: #0d477d;
            margin-bottom: 22px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            color: #444;
            margin-bottom: 7px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d5dbe3;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #0d477d;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .file-help {
            font-size: 12px;
            color: #777;
            margin-top: 6px;
        }

        .preview {
            display: none;
            width: 180px;
            height: 120px;
            object-fit: cover;
            border-radius: 10px;
            margin-top: 12px;
            border: 1px solid #ddd;
        }

        .button-row {
            margin-top: 22px;
            display: flex;
            gap: 10px;
        }

        .save-btn,
        .cancel-btn {
            border: none;
            padding: 13px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .save-btn {
            background: #0d477d;
            color: white;
        }

        .save-btn:hover {
            background: #08365f;
        }

        .cancel-btn {
            background: #e8edf2;
            color: #333;
            display: none;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        .success {
            color: #16803c;
        }

        .error {
            color: #d62828;
        }

        /* ================= GALLERY ================= */

        .gallery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .gallery-header h2 {
            color: #0d477d;
        }

        .gallery-count {
            background: #fff3d6;
            color: #d98b00;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: bold;
        }

        .refresh-btn {
            background: #1769aa;
            color: white;
            border: none;
            padding: 9px 15px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 8px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .gallery-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .gallery-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .gallery-content {
            padding: 20px;
        }

        .gallery-content h3 {
            color: #0d477d;
            margin-bottom: 8px;
        }

        .event-name {
            color: #777;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .gallery-content p {
            color: #666;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .card-actions {
            display: flex;
            gap: 8px;
        }

        .edit-btn,
        .delete-btn {
            border: none;
            padding: 9px 14px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .edit-btn {
            background: #0d477d;
            color: white;
        }

        .delete-btn {
            background: #e53935;
            color: white;
        }

        .empty-box {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 15px;
            color: #777;
            grid-column: 1 / -1;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 900px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 650px) {

            .header {
                padding: 15px;
            }

            .header-left img {
                width: 45px;
                height: 45px;
            }

            .header-left h1 {
                font-size: 18px;
            }

            .header-left p {
                font-size: 11px;
            }

            .header-buttons {
                flex-direction: column;
            }

            .top-btn {
                padding: 8px 12px;
                font-size: 12px;
            }

            .container {
                padding: 0 15px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
            }

            .gallery-header {
                align-items: flex-start;
                gap: 10px;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="header-left">

            <img
                src="../logo/logo.png"
                alt="HAM Club Logo"
            >

            <div>
                <h1>HAM CLUB</h1>
                <p>Gallery Management</p>
            </div>

        </div>

        <div class="header-buttons">

            <a
                href="dashboard.html"
                class="top-btn back-btn"
            >
                ← Dashboard
            </a>

            <button
                class="top-btn logout-btn"
                id="logoutBtn"
            >
                Logout
            </button>

        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="container">

        <div class="page-title">

            <h2>🖼️ Gallery Management</h2>

            <p>
                Upload, edit and remove HAM Club gallery images.
            </p>

        </div>


        <!-- ================= UPLOAD FORM ================= -->

        <section class="form-card">

            <h3 id="formTitle">
                Add Gallery Image
            </h3>

            <form id="galleryForm">

                <div class="form-grid">

                    <!-- TITLE -->

                    <div class="form-group">

                        <label for="title">
                            Title
                        </label>

                        <input
                            type="text"
                            id="title"
                            placeholder="Example: Soldering Workshop"
                            required
                        >

                    </div>


                    <!-- EVENT -->

                    <div class="form-group">

                        <label for="event">
                            Event
                        </label>

                        <input
                            type="text"
                            id="event"
                            placeholder="Example: Soldering Workshop 2026"
                        >

                    </div>


                    <!-- DESCRIPTION -->

                    <div class="form-group full">

                        <label for="description">
                            Description
                        </label>

                        <textarea
                            id="description"
                            placeholder="Write a short description..."
                        ></textarea>

                    </div>


                    <!-- IMAGE -->

                    <div class="form-group full">

                        <label for="image">
                            Gallery Image
                        </label>

                        <input
                            type="file"
                            id="image"
                            accept="image/jpeg,image/jpg,image/png,image/webp"
                        >

                        <div class="file-help">
                            JPG, JPEG, PNG or WebP • Maximum 5 MB
                        </div>

                        <img
                            id="preview"
                            class="preview"
                            alt="Image Preview"
                        >

                    </div>

                </div>


                <div class="button-row">

                    <button
                        type="submit"
                        class="save-btn"
                        id="saveBtn"
                    >
                        Upload Image
                    </button>

                    <button
                        type="button"
                        class="cancel-btn"
                        id="cancelBtn"
                    >
                        Cancel Edit
                    </button>

                </div>

                <div id="message"></div>

            </form>

        </section>


        <!-- ================= EXISTING GALLERY ================= -->

        <section>

            <div class="gallery-header">

                <h2>
                    Existing Gallery
                </h2>

                <div>

                    <span
                        class="gallery-count"
                        id="galleryCount"
                    >
                        0 Images
                    </span>

                    <button
                        class="refresh-btn"
                        onclick="loadGallery()"
                    >
                        🔄 Refresh
                    </button>

                </div>

            </div>


            <div
                class="gallery-grid"
                id="galleryGrid"
            >

                <div class="empty-box">
                    Loading gallery...
                </div>

            </div>

        </section>

    </main>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        /* ==========================================
           API CONFIGURATION
        ========================================== */

        const API_BASE =
            "https://ham-club-backend.onrender.com/api";

        const BACKEND =
            "https://ham-club-backend.onrender.com";


        /* ==========================================
           AUTHENTICATION
        ========================================== */

        let token =
            localStorage.getItem("hamClubToken");

        if (!token) {

            window.location.href =
                "login.html";

        }


        /* ==========================================
           ELEMENTS
        ========================================== */

        const galleryForm =
            document.getElementById("galleryForm");

        const galleryGrid =
            document.getElementById("galleryGrid");

        const galleryCount =
            document.getElementById("galleryCount");

        const titleInput =
            document.getElementById("title");

        const eventInput =
            document.getElementById("event");

        const descriptionInput =
            document.getElementById("description");

        const imageInput =
            document.getElementById("image");

        const preview =
            document.getElementById("preview");

        const message =
            document.getElementById("message");

        const saveBtn =
            document.getElementById("saveBtn");

        const cancelBtn =
            document.getElementById("cancelBtn");

        const formTitle =
            document.getElementById("formTitle");


        let editingId = null;


        /* ==========================================
           LOGOUT
        ========================================== */

        document
            .getElementById("logoutBtn")
            .addEventListener("click", function () {

                localStorage.removeItem("hamClubToken");
                localStorage.removeItem("hamAdminToken");

                window.location.href =
                    "login.html";

            });


        /* ==========================================
           ESCAPE HTML
        ========================================== */

        function escapeHTML(value) {

            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* ==========================================
           IMAGE URL
        ========================================== */

        function imageURL(path) {

            if (!path) {
                return "";
            }

            if (
                path.startsWith("http://") ||
                path.startsWith("https://")
            ) {
                return path;
            }

            if (path.startsWith("/")) {
                return BACKEND + path;
            }

            return BACKEND + "/" + path;

        }


        /* ==========================================
           IMAGE PREVIEW
        ========================================== */

        imageInput.addEventListener(
            "change",
            function () {

                const file =
                    imageInput.files[0];

                if (!file) {

                    preview.style.display =
                        "none";

                    preview.src = "";

                    return;
                }


                /* FILE SIZE */

                if (file.size > 5 * 1024 * 1024) {

                    alert(
                        "Image must be less than 5 MB."
                    );

                    imageInput.value = "";

                    preview.style.display =
                        "none";

                    return;
                }


                /* FILE TYPE */

                const allowed = [
                    "image/jpeg",
                    "image/jpg",
                    "image/png",
                    "image/webp"
                ];

                if (!allowed.includes(file.type)) {

                    alert(
                        "Please select JPG, JPEG, PNG or WebP."
                    );

                    imageInput.value = "";

                    preview.style.display =
                        "none";

                    return;
                }


                /* PREVIEW */

                const reader =
                    new FileReader();

                reader.onload =
                    function (e) {

                        preview.src =
                            e.target.result;

                        preview.style.display =
                            "block";

                    };

                reader.readAsDataURL(file);

            }
        );


        /* ==========================================
           LOAD GALLERY
        ========================================== */

        async function loadGallery() {

            galleryGrid.innerHTML = `
                <div class="empty-box">
                    Loading gallery...
                </div>
            `;

            try {

                const response =
                    await fetch(
                        `${API_BASE}/gallery`
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Failed to load gallery"
                    );

                }


                const items =
                    data.gallery || [];


                galleryCount.textContent =
                    `${items.length} Image${items.length !== 1 ? "s" : ""}`;


                if (items.length === 0) {

                    galleryGrid.innerHTML = `
                        <div class="empty-box">
                            📭 No gallery images found.
                        </div>
                    `;

                    return;
                }


                galleryGrid.innerHTML =
                    items.map(item => {

                        const image =
                            imageURL(item.image);


                        return `

                            <article class="gallery-card">

                                ${
                                    image
                                    ?
                                    `
                                    <img
                                        src="${escapeHTML(image)}"
                                        alt="${escapeHTML(item.title || "Gallery image")}"
                                        onerror="this.style.display='none'"
                                    >
                                    `
                                    :
                                    ""
                                }

                                <div class="gallery-content">

                                    <h3>
                                        ${escapeHTML(
                                            item.title ||
                                            "Untitled"
                                        )}
                                    </h3>

                                    ${
                                        item.event
                                        ?
                                        `
                                        <div class="event-name">
                                            📅 ${escapeHTML(item.event)}
                                        </div>
                                        `
                                        :
                                        ""
                                    }

                                    <p>
                                        ${escapeHTML(
                                            item.description ||
                                            "No description"
                                        )}
                                    </p>

                                    <div class="card-actions">

                                        <button
                                            class="edit-btn"
                                            onclick="editGallery('${item._id}')"
                                        >
                                            ✏️ Edit
                                        </button>

                                        <button
                                            class="delete-btn"
                                            onclick="deleteGallery('${item._id}')"
                                        >
                                            🗑 Delete
                                        </button>

                                    </div>

                                </div>

                            </article>

                        `;

                    }).join("");


            } catch (error) {

                console.error(
                    "Gallery loading error:",
                    error
                );

                galleryGrid.innerHTML = `
                    <div class="empty-box">
                        ❌ Failed to load gallery.
                        <br><br>
                        ${escapeHTML(error.message)}
                    </div>
                `;

            }

        }


        /* ==========================================
           UPLOAD / UPDATE
        ========================================== */

        galleryForm.addEventListener(
            "submit",
            async function (e) {

                e.preventDefault();


                const title =
                    titleInput.value.trim();

                const eventName =
                    eventInput.value.trim();

                const description =
                    descriptionInput.value.trim();


                if (!title) {

                    alert(
                        "Please enter a title."
                    );

                    return;
                }


                saveBtn.disabled =
                    true;

                saveBtn.textContent =
                    editingId
                    ?
                    "Updating..."
                    :
                    "Uploading...";

                message.textContent =
                    "";


                try {

                    /* ==================================
                       CREATE NEW GALLERY IMAGE
                    ================================== */

                    if (!editingId) {

                        const file =
                            imageInput.files[0];


                        if (!file) {

                            alert(
                                "Please select an image."
                            );

                            saveBtn.disabled =
                                false;

                            saveBtn.textContent =
                                "Upload Image";

                            return;
                        }


                        const formData =
                            new FormData();


                        formData.append(
                            "title",
                            title
                        );

                        formData.append(
                            "description",
                            description
                        );

                        formData.append(
                            "event",
                            eventName
                        );

                        formData.append(
                            "image",
                            file
                        );


                        const response =
                            await fetch(
                                `${API_BASE}/gallery`,
                                {
                                    method: "POST",

                                    headers: {
                                        Authorization:
                                            `Bearer ${token}`
                                    },

                                    body: formData
                                }
                            );


                        if (
                            response.status === 401 ||
                            response.status === 403
                        ) {

                            localStorage.removeItem(
                                "hamClubToken"
                            );

                            window.location.href =
                                "login.html";

                            return;
                        }


                        const data =
                            await response.json();


                        if (
                            !response.ok ||
                            !data.success
                        ) {

                            throw new Error(
                                data.message ||
                                "Upload failed"
                            );

                        }


                        message.className =
                            "success";

                        message.textContent =
                            "✅ Gallery image uploaded successfully.";

                    }


                    /* ==================================
                       UPDATE EXISTING IMAGE
                    ================================== */

                    else {

                        const response =
                            await fetch(
                                `${API_BASE}/gallery/${editingId}`,
                                {
                                    method: "PUT",

                                    headers: {
                                        "Content-Type":
                                            "application/json",

                                        Authorization:
                                            `Bearer ${token}`
                                    },

                                    body: JSON.stringify({

                                        title:
                                            title,

                                        description:
                                            description,

                                        event:
                                            eventName

                                    })
                                }
                            );


                        if (
                            response.status === 401 ||
                            response.status === 403
                        ) {

                            localStorage.removeItem(
                                "hamClubToken"
                            );

                            window.location.href =
                                "login.html";

                            return;
                        }


                        const data =
                            await response.json();


                        if (
                            !response.ok ||
                            !data.success
                        ) {

                            throw new Error(
                                data.message ||
                                "Update failed"
                            );

                        }


                        message.className =
                            "success";

                        message.textContent =
                            "✅ Gallery information updated.";

                    }


                    resetForm();

                    await loadGallery();


                } catch (error) {

                    console.error(
                        "Gallery save error:",
                        error
                    );

                    message.className =
                        "error";

                    message.textContent =
                        "❌ " +
                        error.message;

                } finally {

                    saveBtn.disabled =
                        false;

                    saveBtn.textContent =
                        editingId
                        ?
                        "Update Image"
                        :
                        "Upload Image";

                }

            }
        );


        /* ==========================================
           EDIT GALLERY
        ========================================== */

        async function editGallery(id) {

            try {

                const response =
                    await fetch(
                        `${API_BASE}/gallery/${id}`
                    );


                if (
                    response.status === 401 ||
                    response.status === 403
                ) {

                    localStorage.removeItem(
                        "hamClubToken"
                    );

                    window.location.href =
                        "login.html";

                    return;
                }


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Unable to load gallery item"
                    );

                }


                const item =
                    data.item;


                editingId =
                    item._id;


                titleInput.value =
                    item.title || "";

                eventInput.value =
                    item.event || "";

                descriptionInput.value =
                    item.description || "";


                formTitle.textContent =
                    "Edit Gallery Image";

                saveBtn.textContent =
                    "Update Image";

                cancelBtn.style.display =
                    "inline-block";


                preview.src =
                    imageURL(item.image);

                preview.style.display =
                    item.image
                    ?
                    "block"
                    :
                    "none";


                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });


            } catch (error) {

                console.error(
                    "Edit gallery error:",
                    error
                );

                alert(
                    "❌ " +
                    error.message
                );

            }

        }


        /* ==========================================
           DELETE GALLERY
        ========================================== */

        async function deleteGallery(id) {

            const confirmed =
                confirm(
                    "Are you sure you want to delete this gallery image?"
                );


            if (!confirmed) {
                return;
            }


            try {

                const response =
                    await fetch(
                        `${API_BASE}/gallery/${id}`,
                        {
                            method: "DELETE",

                            headers: {
                                Authorization:
                                    `Bearer ${token}`
                            }
                        }
                    );


                if (
                    response.status === 401 ||
                    response.status === 403
                ) {

                    localStorage.removeItem(
                        "hamClubToken"
                    );

                    window.location.href =
                        "login.html";

                    return;
                }


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Delete failed"
                    );

                }


                alert(
                    "Gallery image deleted successfully."
                );


                await loadGallery();


            } catch (error) {

                console.error(
                    "Delete gallery error:",
                    error
                );

                alert(
                    "❌ " +
                    error.message
                );

            }

        }


        /* ==========================================
           RESET FORM
        ========================================== */

        function resetForm() {

            editingId =
                null;

            galleryForm.reset();

            preview.src =
                "";

            preview.style.display =
                "none";

            formTitle.textContent =
                "Add Gallery Image";

            saveBtn.textContent =
                "Upload Image";

            cancelBtn.style.display =
                "none";

            message.textContent =
                "";

        }


        /* ==========================================
           CANCEL EDIT
        ========================================== */

        cancelBtn.addEventListener(
            "click",
            resetForm
        );


        /* ==========================================
           START
        ========================================== */

        loadGallery();

    </script>

</body>

</html>
